[project]
name = "adi"
version = "0.1.0"
description = "Adi — autonomous security assessment workspace for authorized testing (CTFs, labs, audits)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "cryptography>=42",
    "typer>=0.12",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "anyio>=4.3",
    "keyring>=25.0",
]

[project.optional-dependencies]
phase5-lab = ["fastapi>=0.115,<0.142", "uvicorn>=0.30"]
source-tools = ["semgrep>=1.100"]
docker = ["docker>=7.0"]
browser = ["playwright>=1.42"]
anthropic = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
adi = "adi.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
